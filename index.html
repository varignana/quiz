// ── AI Prompt Builder (dynamic per exam + allowedTypes) ──────────────────
function buildAIPrompt(exam){
  exam=exam||ACTIVE_EXAM||{provider:'Exam',name:'',totalQ:65,timeMins:90,passScore:70,allowedTypes:['single','multi']};
  var allowed=exam.allowedTypes||['single','multi','truefalse','matching','ordering'];
  var examLabel=(exam.provider||'')+(exam.name?' \u2014 '+exam.name:'');
  var L=[];
  var hr='\u2550'.repeat(62);var thr='\u2500'.repeat(62);
  L.push(hr);L.push('ExamForge \u2014 AI QUESTION & EXPLANATION PROMPT');L.push(hr);L.push('');
  L.push('EXAM: '+examLabel);
  L.push('Questions: '+exam.totalQ+'  |  Time: '+exam.timeMins+' min  |  Pass score: '+exam.passScore);
  L.push('Active question types for this exam: '+allowed.join(', '));
  L.push('');
  L.push(thr);L.push('PART A \u2014 ADD NEW QUESTIONS');L.push(thr);
  L.push('Append new objects to the "questions" array in the downloaded JSON.');
  L.push('Rules:');
  L.push('\u2022 IDs must be sequential integers (last existing ID + 1, + 2, \u2026)');
  L.push('\u2022 Set "explanation": null on every new question (fill it in Part B)');
  L.push('\u2022 "category" is a short topic label, e.g. "History", "Law & Rights"');
  L.push('\u2022 "stem" must be accurate, unambiguous, and self-contained');
  L.push('\u2022 Return raw JSON only \u2014 no markdown fences, no extra text');
  L.push('');
  L.push('QUESTION FORMATS (only the types active for this exam are shown below)');
  L.push('');

  if(allowed.indexOf('single')>=0){
    L.push('\u25b6 TYPE "single" \u2014 One correct answer from 4 options');
    L.push(JSON.stringify({id:1,type:'single',stem:'Which of the following best describes [concept]?',options:{A:'First option',B:'Second option',C:'Correct option — replace all four with real answer choices',D:'Fourth option'},correct:['C'],category:'Topic Name',explanation:null},null,2));
    L.push('');
  }
  if(allowed.indexOf('multi')>=0){
    L.push('\u25b6 TYPE "multi" \u2014 Choose ALL correct answers (stem must say "Which TWO\u2026" or "Select all that apply\u2026")');
    L.push(JSON.stringify({id:2,type:'multi',stem:'Which TWO of the following are examples of [concept]?',options:{A:'Correct option A',B:'Wrong option',C:'Correct option C',D:'Wrong option'},correct:['A','C'],category:'Topic Name',explanation:null},null,2));
    L.push('');
  }
  if(allowed.indexOf('truefalse')>=0){
    L.push('\u25b6 TYPE "truefalse" \u2014 Is the statement True or False?');
    L.push('  \u2022 "stem" contains the factual statement to evaluate \u2014 no options array needed');
    L.push('  \u2022 "correct" is ["True"] or ["False"]');
    L.push('  \u2022 Write clear, unambiguous statements that are definitively true or false');
    L.push('Example with correct answer True:');
    L.push(JSON.stringify({id:3,type:'truefalse',stem:'[A factual statement that is clearly and definitively TRUE about this topic.]',correct:['True'],category:'Topic Name',explanation:null},null,2));
    L.push('Example with correct answer False:');
    L.push(JSON.stringify({id:4,type:'truefalse',stem:'[A statement that contains a specific factual error, testing whether the student can identify it.]',correct:['False'],category:'Topic Name',explanation:null},null,2));
    L.push('');
  }
  if(allowed.indexOf('ordering')>=0){
    L.push('\u25b6 TYPE "ordering" \u2014 Drag steps into the correct sequence');
    L.push('  \u2022 "correct" lists all items in the RIGHT order (first to last)');
    L.push('  \u2022 The app shuffles them randomly when presenting to the user');
    L.push(JSON.stringify({id:5,type:'ordering',stem:'Put the following steps in the correct order.',correct:['First step text','Second step text','Third step text','Fourth step text'],category:'Topic Name',explanation:null},null,2));
    L.push('');
  }
  if(allowed.indexOf('matching')>=0){
    L.push('\u25b6 TYPE "matching" \u2014 Match each item (left) to its correct description (right)');
    L.push('  \u2022 "options": the right-hand column values (the pool to match against)');
    L.push('  \u2022 "pairs": each left-column item with its correct right-column match');
    L.push(JSON.stringify({id:6,type:'matching',stem:'Match each item on the left to its correct description.',options:['Description of A','Description of B','Description of C','Description of D'],pairs:[{description:'Item A',correct:'Description of A'},{description:'Item B',correct:'Description of B'},{description:'Item C',correct:'Description of C'},{description:'Item D',correct:'Description of D'}],category:'Topic Name',explanation:null},null,2));
    L.push('');
  }

  L.push(thr);L.push('PART B \u2014 FILL EXPLANATIONS (run as a separate task)');L.push(thr);
  L.push('You will receive the questions array with "explanation": null entries.');
  L.push('Fill every null explanation using the formats shown below.');
  L.push('Return ONLY valid JSON \u2014 no markdown, no backticks, no preamble.');
  L.push('Do NOT add, remove, or rename any other keys.');
  L.push('You may process the whole file or any subset \u2014 even a single question.');
  L.push('');
  L.push('EXPLANATION FORMAT BY TYPE:');L.push('');

  if(allowed.indexOf('single')>=0){
    L.push('\u2500 TYPE "single" \u2500');
    L.push('"explanation": {\n  "concept": "One or two sentences explaining the core topic.",\n  "A": { "ok": false, "why": "Why A is wrong." },\n  "B": { "ok": false, "why": "Why B is wrong." },\n  "C": { "ok": true,  "why": "Why C is the correct answer." },\n  "D": { "ok": false, "why": "Why D is wrong." }\n}');
    L.push('\u2022 Include ALL option letters present in the question. "ok": true = correct answer.');L.push('');
  }
  if(allowed.indexOf('multi')>=0){
    L.push('\u2500 TYPE "multi" \u2500');
    L.push('Same structure as "single" but multiple keys have "ok": true.');
    L.push('"explanation": {\n  "concept": "What all correct answers have in common.",\n  "A": { "ok": true,  "why": "Why A is correct." },\n  "B": { "ok": false, "why": "Why B is wrong." },\n  "C": { "ok": true,  "why": "Why C is correct." },\n  "D": { "ok": false, "why": "Why D is wrong." }\n}');L.push('');
  }
  if(allowed.indexOf('truefalse')>=0){
    L.push('\u2500 TYPE "truefalse" \u2500');
    L.push('"explanation": {\n  "concept": "Brief background on the topic the statement covers.",\n  "why": "Explain directly why the statement is True or False, citing the relevant fact."\n}');
    L.push('Example (answer is True):\n"explanation": {\n  "concept": "Background on this topic.",\n  "why": "TRUE \u2014 [specific fact or evidence that confirms the statement]."\n}');
    L.push('Example (answer is False):\n"explanation": {\n  "concept": "Background on this topic.",\n  "why": "FALSE \u2014 [the actual correct fact that contradicts the statement]."\n}');L.push('');
  }
  if(allowed.indexOf('ordering')>=0){
    L.push('\u2500 TYPE "ordering" \u2500');
    L.push('"explanation": {\n  "concept": "Why this sequence matters.",\n  "steps": [\n    { "step": "Exact step text from question", "why": "Why this step comes first." },\n    { "step": "Exact step text from question", "why": "Why this step comes second." },\n    { "step": "Exact step text from question", "why": "Why this step comes third." }\n  ]\n}');
    L.push('\u26a0 "steps" MUST be inside "explanation". Each "step" value must match the question text exactly.');L.push('');
  }
  if(allowed.indexOf('matching')>=0){
    L.push('\u2500 TYPE "matching" \u2500');
    L.push('"explanation": {\n  "concept": "Overview of the category being matched.",\n  "explanations": [\n    { "description": "Exact description text from question", "correct": "Matched option", "why": "Why this pairing is correct." },\n    { "description": "Exact description text from question", "correct": "Matched option", "why": "Why this pairing is correct." }\n  ]\n}');
    L.push('\u26a0 "explanations" MUST be inside "explanation". Each "description" must match the question text exactly.');L.push('');
  }

  L.push(thr);L.push('COMMON MISTAKES');L.push(thr);
  L.push('\u2717 { "id":10, "steps":[...], "explanation": null }  \u2190 steps/explanations at root level');
  L.push('\u2713 { "id":10, "explanation": { "concept":"...", "steps":[...] } }');L.push('');
  L.push('\u2717 { "description": "description": "Some text" }  \u2190 duplicate key = invalid JSON');
  L.push('\u2713 { "description": "Some text" }');L.push('');
  L.push('For large files: process 30\u201350 questions per request and upload each batch separately.');
  return L.join('\n');
}

// ── Exam Review & Set Start ───────────────────────────────────────────────
function reviewExamAttempt(examIdx){
  var attempt=S.exams[examIdx];
  if(!attempt||!attempt.qids){alert('Review data not available for this attempt.');return;}
  var qs=attempt.qids.map(function(id){return QS.find(function(q){return q.id===id;});}).filter(Boolean);
  if(!qs.length){alert('Question data is not available. Questions may have been deleted.');return;}
  clearInterval(examInterval);
  S.exam={
    questions:qs,answers:attempt.answers||{},flagged:{},idx:0,
    startTime:Date.now()-(attempt.elapsed||0)*1000,
    submitted:true,sel:null,matchSel:{},orderItems:null,
    secs:(ACTIVE_EXAM?ACTIVE_EXAM.timeMins:90)*60,
    setName:attempt.setName||null,isReview:true
  };
  S.view='exam';render();
}
function _startSet(setId){
  var set=(ACTIVE_EXAM&&ACTIVE_EXAM.sets||[]).find(function(s){return s.id===setId;});
  if(!set)return;
  startExam(set.qids,{setName:set.name,shuffle:set.shuffle!==false});
}

// ── Password Management ───────────────────────────────────────────────────
async function doRecoveryPwd(){
  var p1=document.getElementById('recPwd1').value;
  var p2=document.getElementById('recPwd2').value;
  var msg=document.getElementById('recPwdMsg');
  msg.textContent='';
  if(p1.length<6){msg.style.color='var(--err-txt)';msg.textContent='Password must be at least 6 characters.';return;}
  if(p1!==p2){msg.style.color='var(--err-txt)';msg.textContent='Passwords do not match.';return;}
  var btn=document.getElementById('recPwdBtn');btn.disabled=true;btn.textContent='Saving\u2026';
  try{
    var r=await SB.auth.updateUser({password:p1});
    if(r.error)throw r.error;
    msg.style.color='var(--ok-txt)';msg.textContent='\u2713 Password updated! Redirecting\u2026';
    setTimeout(function(){window.location.href=window.location.href.split('#')[0];},1500);
  }catch(e){
    msg.style.color='var(--err-txt)';msg.textContent=e.message||'Failed to update password.';
    btn.disabled=false;btn.textContent='Set Password';
  }
}
function showChangePwd(){
  var f=document.getElementById('changePwdForm');
  if(f){f.classList.toggle('open');if(f.classList.contains('open')){var i=document.getElementById('changePwdNew');if(i)i.focus();}}

  var btn=document.getElementById('changePwdBtn');btn.disabled=true;btn.textContent='Saving\u2026';
  try{

function showLinkEmail(){
  var f=document.getElementById('linkEmailForm');
  if(f){f.classList.toggle('open');if(f.classList.contains('open')){var i=document.getElementById('linkEmailInput');if(i)i.focus();}}
}
async function doLinkEmail(){
  var email=document.getElementById('linkEmailInput').value.trim();
  var msg=document.getElementById('linkEmailMsg');
  msg.textContent='';
  if(!email||!email.includes('@')){msg.style.color='var(--err-txt)';msg.textContent='Enter a valid email address.';return;}
  var btn=document.getElementById('linkEmailBtn');btn.disabled=true;btn.textContent='Sending\u2026';
  try{
    var r=await SB.auth.updateUser({data:{recovery_email:email}});
    if(r.error)throw r.error;
    localStorage.setItem('quiz_real_email_'+USERNAME,email);
    msg.style.color='var(--ok-txt)';msg.textContent='\u2713 Recovery email saved! If you forget your password, contact the admin and share this email (\u201c'+email+'\u201d) to confirm your identity.';
    btn.disabled=false;btn.textContent='Link Email';
  }catch(e){
    msg.style.color='var(--err-txt)';msg.textContent=e.message||'Failed to link email.';
    btn.disabled=false;btn.textContent='Link Email';
  }
}
function showForgotPwd(){
  var f=document.getElementById('forgotArea');
  if(f)f.classList.toggle('open');
}
async function doForgotPwd(){
  var val=document.getElementById('forgotInput').value.trim();
  var msg=document.getElementById('forgotMsg');
  msg.textContent='';
  if(!val){msg.style.color='var(--err-txt)';msg.textContent='Enter your email or username.';return;}
  var email=val;
  if(!val.includes('@')){
    var stored=localStorage.getItem('quiz_real_email_'+val.toLowerCase());
    if(stored){email=stored;}
    else{email=val.toLowerCase().replace(/[^a-z0-9_-]/g,'_')+'@awsquiz.app';}
  }
  var btn=document.getElementById('forgotBtn');btn.disabled=true;btn.textContent='Sending\u2026';
  try{
    var r=await SB.auth.resetPasswordForEmail(email,{redirectTo:window.location.href.split('#')[0]});
    if(r.error)throw r.error;
    msg.style.color='var(--ok-txt)';msg.textContent='If that address is registered, a reset link has been sent. Check your inbox (and spam folder).';
    btn.disabled=false;btn.textContent='Send Reset Link';
  }catch(e){
    msg.style.color='var(--err-txt)';msg.textContent=e.message||'Failed to send reset link.';
    btn.disabled=false;btn.textContent='Send Reset Link';
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────
(async function boot(){
  SB=supabase.createClient(SB_URL,SB_KEY);
  SB.auth.onAuthStateChange(async function(event,session){
    if(event==='PASSWORD_RECOVERY'){
      document.getElementById('authOverlay').style.display='none';
      var existing=document.getElementById('pwdRecoveryOverlay');
      if(existing)return;
      var ov=document.createElement('div');ov.className='overlay';ov.id='pwdRecoveryOverlay';
      ov.innerHTML='<div class="modal"><h2>&#128274; Set New Password</h2>'
        +'<p class="minfo">Your reset link is valid. Choose a new password below.</p>'
        +'<label class="mlabel">New Password</label>'
        +'<input class="minput" id="recPwd1" type="password" placeholder="at least 6 characters" autocomplete="new-password">'
        +'<label class="mlabel">Confirm Password</label>'
        +'<input class="minput" id="recPwd2" type="password" placeholder="repeat password" autocomplete="new-password">'
        +'<button class="btn-acc" id="recPwdBtn" onclick="doRecoveryPwd()">Set Password →</button>'
        +'<div class="errbox" id="recPwdMsg" style="margin-top:8px"></div></div>';
      document.body.appendChild(ov);
    }
  });
  try{
    var sr=await SB.auth.getSession();
    if(sr.data&&sr.data.session&&sr.data.session.user){
      USERID=sr.data.session.user.id;USERNAME=localStorage.getItem('quiz_username')||sr.data.session.user.email.split('@')[0];
      document.getElementById('authOverlay').style.display='none';document.getElementById('hdrEl').style.display='';
      await startApp();return;
    }
  }catch(e){console.warn(e);}
  var saved=localStorage.getItem('quiz_username');if(saved)document.getElementById('authUser').value=saved;
})();
