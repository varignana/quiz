<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamForge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="application/json" id="qdata">[]</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--surf:#fff;--surf2:#f6f8fa;--text:#111827;--muted:#6b7280;--hint:#9ca3af;
  --bdr:rgba(0,0,0,.09);--bdr2:rgba(0,0,0,.16);
  --acc:#e07b00;--acc-bg:#fff7ed;--acc-txt:#92400e;
  --ok:#15803d;--ok-bg:#f0fdf4;--ok-txt:#166534;
  --err:#b91c1c;--err-bg:#fef2f2;--err-txt:#991b1b;
  --info-bg:#eff6ff;--info-txt:#1e40af;
  --warn-bg:#fefce8;--warn-txt:#854d0e;
  --r:10px;--rs:7px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1117;--surf:#161b22;--surf2:#21262d;--text:#e6edf3;--muted:#8b949e;--hint:#484f58;
  --bdr:rgba(255,255,255,.07);--bdr2:rgba(255,255,255,.15);
  --acc:#FF9900;--acc-bg:#1a1200;--acc-txt:#FFB84D;
  --ok:#4ade80;--ok-bg:#022c22;--ok-txt:#86efac;
  --err:#f87171;--err-bg:#1c0000;--err-txt:#fca5a5;
  --info-bg:#0f172a;--info-txt:#93c5fd;
  --warn-bg:#1c1400;--warn-txt:#fcd34d
}}
html,body{overflow-x:hidden;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.65}

/* ── HEADER ── */
.hdr{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0;display:flex;flex-direction:column;position:sticky;top:0;z-index:30;width:100%;overflow:hidden;}
/* row 1: logo left, controls right */
.hdr-top-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 3px;border-bottom:1px solid var(--bdr);min-height:30px;gap:6px;}
.hdr-logo{display:flex;align-items:baseline;gap:0;white-space:nowrap;flex-shrink:0;}
.hdr-logo-aws{font-weight:800;font-size:11px;color:var(--acc);letter-spacing:.07em;text-transform:uppercase;}
.hdr-logo-sub{font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
/* row 2: nav centered */
.hdr-nav-row{display:flex;justify-content:center;align-items:stretch;min-height:36px;overflow:hidden;border-bottom:0;}
.hdr-nav{display:flex;align-items:stretch;gap:0;overflow:hidden;justify-content:center;}
.hnav{display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:var(--muted);background:transparent;border:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;gap:3px;transition:color .15s;flex-shrink:1;}
.hnav:hover:not(.hnav-act){color:var(--text);background:var(--surf2)}
.hnav.hnav-act{color:var(--acc);border-bottom-color:var(--acc)}
.hdr-right{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-ok{background:var(--ok)}.dot-err{background:var(--err)}.dot-wait{background:var(--hint)}
.hdr-sync{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);white-space:nowrap}
@media(max-width:540px){#syncTxt{display:none}.hdr-sync{gap:2px}#hdrNameTxt{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}}
.sync-lbl{font-size:10px;color:var(--muted);white-space:nowrap;display:inline}
.try-btn{font-size:10px;font-weight:600;padding:3px 6px;border-radius:var(--rs);border:1px solid var(--bdr2);background:var(--surf2);color:var(--text);cursor:pointer;white-space:nowrap;}
.try-btn:hover{background:var(--surf)}
.try-dropdown{position:absolute;top:64px;left:0;right:0;background:var(--surf);border-bottom:1px solid var(--bdr2);z-index:50;max-height:60vh;overflow-y:auto;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.try-dropdown.open{display:block}
.try-option{padding:10px 16px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--bdr)}
.try-option:hover{background:var(--surf2)}
.try-option.active{color:var(--acc);font-weight:700}
.guest-banner{background:var(--surf2);border:1.5px dashed var(--bdr2);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guest-banner-txt{flex:1;font-size:13px;color:var(--muted);line-height:1.5}
.guest-banner-txt strong{color:var(--text)}

/* ── GENERIC ── */
.btn{padding:5px 9px;border-radius:var(--rs);border:1px solid var(--bdr2);background:transparent;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap;line-height:1.4;flex-shrink:0}
.btn:hover{background:var(--surf2)}.btn:disabled{opacity:.35;cursor:default}
.btn-pri{background:var(--text);color:var(--surf);border-color:var(--text);font-weight:600}
.btn-pri:hover{opacity:.85;background:var(--text)}
.btn-acc{display:block;width:100%;background:var(--acc);color:#000;border:none;font-weight:700;border-radius:var(--rs);padding:11px 22px;font-size:14px;cursor:pointer}
.btn-acc:hover{opacity:.9}.btn-acc:disabled{opacity:.4;cursor:default}
.main{max-width:780px;margin:0 auto;padding:14px 12px 80px;width:100%}

/* ── PROGRESS / NAV ── */
.prog-wrap{margin-bottom:10px}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.prog-bar{background:var(--bdr);border-radius:99px;height:5px}
.prog-fill{background:var(--acc);border-radius:99px;height:5px;transition:width .3s}
.nav-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:14px}
.nav-prev{justify-self:start}.nav-stats{display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:nowrap}.nav-next{justify-self:end}
.pill{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-ok{background:var(--ok-bg);color:var(--ok-txt)}.pill-err{background:var(--err-bg);color:var(--err-txt)}.pill-neu{background:var(--surf2);color:var(--muted);border:1px solid var(--bdr)}
.btn-nav{padding:7px 13px;border-radius:var(--rs);border:1.5px solid var(--bdr2);background:var(--surf);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-nav:hover:not(:disabled){background:var(--surf2)}.btn-nav:disabled{opacity:.3;cursor:default}
.btn-nav-next{background:var(--acc);color:#000;border-color:var(--acc);padding:8px 16px;font-size:14px;box-shadow:0 2px 8px rgba(224,123,0,.35)}
.btn-nav-next:hover:not(:disabled){opacity:.9;background:var(--acc)}

/* ── CARD / QUESTION ── */
.tbadge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.tb-s{background:var(--info-bg);color:var(--info-txt)}.tb-m{background:var(--warn-bg);color:var(--warn-txt)}.tb-match{background:var(--ok-bg);color:var(--ok-txt)}.tb-ord{background:var(--acc-bg);color:var(--acc-txt)}
.card{background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);padding:18px;margin-bottom:10px}
.qnum{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.stem{font-size:15px;line-height:1.75;margin-bottom:16px}
.opt{display:block;position:relative;padding:12px 14px 12px 52px;min-height:52px;border-radius:var(--rs);border:1.5px solid var(--bdr);margin-bottom:8px;cursor:pointer;background:var(--surf2);font-size:14px;line-height:1.55;word-wrap:break-word;transition:border-color .15s,background .15s;}
.opt::before{content:attr(data-icon);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bdr2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);background:transparent;transition:all .15s;}
.opt:hover:not(.locked):not(.rev-ok):not(.rev-wrong):not(.rev-skip){border-color:var(--acc);background:var(--acc-bg)}
.opt:hover:not(.locked):not(.rev-ok):not(.rev-wrong):not(.rev-skip)::before{color:var(--acc-txt);border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc-bg)}.opt.sel::before{color:var(--acc-txt);border-color:var(--acc);background:var(--acc-bg)}
.opt.rev-ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}.opt.rev-ok::before{content:'\2713';color:var(--ok-txt);border-color:var(--ok);background:var(--ok-bg)}
.opt.rev-wrong{border-color:var(--err);background:var(--err-bg);cursor:default}.opt.rev-wrong::before{content:'\2717';color:var(--err-txt);border-color:var(--err);background:var(--err-bg)}
.opt.rev-skip{cursor:default;opacity:.45}.opt.locked{cursor:default}
.mhint{font-size:11px;color:var(--muted);margin-bottom:9px;font-style:italic}
.mtbl{width:100%;border-collapse:separate;border-spacing:0 7px}
.mdesc{font-size:13px;line-height:1.5;padding-right:8px;width:52%}
.msel select{width:100%;padding:6px 8px;border:1.5px solid var(--bdr2);border-radius:var(--rs);background:var(--surf);color:var(--text);font-size:13px;cursor:pointer}
.msel select.ok{border-color:var(--ok);background:var(--ok-bg)}.msel select.err{border-color:var(--err);background:var(--err-bg)}
.mico{width:26px;text-align:center;font-size:14px}
.olist{list-style:none;display:flex;flex-direction:column;gap:6px}
.oitem{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:var(--rs);border:1.5px solid var(--bdr);background:var(--surf2);cursor:grab;user-select:none;transition:border-color .12s,background .12s}
.oitem:active{cursor:grabbing}.oitem.dragging{opacity:.5;border-color:var(--acc)}.oitem.drag-over{border-color:var(--acc);background:var(--acc-bg)}
.oitem.rev-ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}.oitem.rev-err{border-color:var(--err);background:var(--err-bg);cursor:default}.oitem.locked{cursor:default}
.onum{width:23px;height:23px;border-radius:50%;background:var(--bdr);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
.oitem.rev-ok .onum{background:var(--ok);color:#fff}.oitem.rev-err .onum{background:var(--err);color:#fff}
.ogrip{color:var(--hint);font-size:13px;flex-shrink:0}.otxt2{font-size:13px;line-height:1.5;flex:1;min-width:0;word-break:break-word}
.banner{padding:10px 13px;border-radius:var(--rs);font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.5}
.ban-ok{background:var(--ok-bg);color:var(--ok-txt)}.ban-err{background:var(--err-bg);color:var(--err-txt)}.ban-info{background:var(--info-bg);color:var(--info-txt)}
.expl{background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);padding:14px 18px;margin-bottom:10px}
.xhdr{font-size:13px;font-weight:700;margin-bottom:9px}
.xcpt{background:var(--info-bg);color:var(--info-txt);border-radius:var(--rs);padding:8px 11px;font-size:13px;margin-bottom:11px;line-height:1.5}
.xrow{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
.xico{font-size:13px;flex-shrink:0;width:18px;margin-top:2px}.xtxt{font-size:13px;line-height:1.6}
.xtxt.bok{color:var(--ok-txt)}.xtxt.berr{color:var(--err-txt)}
input.jmp{border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--surf);color:var(--text);padding:5px 8px;font-size:12px;width:54px;text-align:center}

/* ── STATS / FOCUS ── */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px}
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:11px;text-align:center}
.sn{font-size:22px;font-weight:700;margin-bottom:2px}.sl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sn-ok{color:var(--ok)}.sn-err{color:var(--err)}.sn-acc{color:var(--acc)}
.qmap{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:16px}
.qd{width:26px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;border:1px solid var(--bdr);background:var(--surf2);color:var(--hint);font-weight:700;transition:transform .1s}
.qd:hover{transform:scale(1.2);z-index:1}.qd.cur{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.qd.dok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-txt)}.qd.derr{background:var(--err-bg);border-color:var(--err);color:var(--err-txt)}
.ftbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ftbl th{text-align:left;padding:6px 9px;border-bottom:2px solid var(--bdr2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ftbl td{padding:6px 9px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.ftbl tr:hover td{background:var(--surf2)}
.fdot{display:inline-flex;width:15px;height:15px;border-radius:50%;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin:1px}
.dok2{background:var(--ok-bg);color:var(--ok-txt)}.derr2{background:var(--err-bg);color:var(--err-txt)}.dskip{background:var(--surf2);border:1px solid var(--bdr);color:var(--hint)}
.try-sec{background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);padding:14px 16px;margin-bottom:10px}
.try-hdr{font-weight:600;font-size:14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.swrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:12px}
.spin{width:14px;height:14px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:28px;color:var(--muted);font-size:14px}
.h2{font-size:15px;font-weight:700;margin-bottom:12px}

/* ── EXAM ── */
.exam-timer{font-family:monospace;font-size:18px;font-weight:700;padding:5px 12px;border-radius:var(--rs);background:var(--surf2);border:1.5px solid var(--bdr2);min-width:70px;text-align:center;flex-shrink:0;}
.exam-timer.warn{background:var(--warn-bg);color:var(--warn-txt);border-color:var(--warn-txt)}
.exam-timer.crit{background:var(--err-bg);color:var(--err-txt);border-color:var(--err);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.exam-qmap{display:flex;flex-wrap:wrap;gap:3px;padding:10px;background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);margin-bottom:12px}
.eqd{width:28px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;border:1px solid var(--bdr);background:var(--surf2);color:var(--hint);font-weight:700}
.eqd:hover{opacity:.8}.eqd.ecur{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.eqd.edone{background:var(--info-bg);border-color:var(--info-txt);color:var(--info-txt)}
.eqd.eflag{background:var(--warn-bg);border-color:var(--warn-txt);color:var(--warn-txt)}
.eqd.eok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-txt)}.eqd.eerr{background:var(--err-bg);border-color:var(--err);color:var(--err-txt)}
.flag-btn{padding:5px 10px;border-radius:var(--rs);border:1px solid var(--bdr2);background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
.flag-btn.on{background:var(--warn-bg);color:var(--warn-txt);border-color:var(--warn-txt)}
.score-circle{width:110px;height:110px;border-radius:50%;border:6px solid var(--bdr);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.score-circle.pass{border-color:var(--ok)}.score-circle.fail{border-color:var(--err)}
.score-num{font-size:26px;font-weight:700}.score-sub{font-size:11px;color:var(--muted)}
.exam-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--bdr);background:var(--surf2);margin-bottom:7px;gap:8px;flex-wrap:wrap}
.exam-row-pass{border-color:var(--ok);background:var(--ok-bg)}.exam-row-fail{border-color:var(--err);background:var(--err-bg)}

/* ── AUTH ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
@media(max-width:600px){#adminModal,#createSetOv{align-items:flex-start;padding:70px 8px 30px;overflow-y:scroll;-webkit-overflow-scrolling:touch}#adminModal .modal,#createSetOv .modal{max-height:none!important;overflow-y:visible!important;border-radius:12px;padding:16px 14px;width:100%;box-sizing:border-box}}
.modal{background:var(--surf);border-radius:var(--r);padding:22px;max-width:380px;width:100%;border:1px solid var(--bdr2)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:5px}
.minfo{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.mlabel{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.minput{width:100%;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--surf2);color:var(--text);padding:9px 11px;font-size:14px;margin-bottom:11px;font-family:inherit}
.minput:focus{outline:none;border-color:var(--acc)}
.errbox{background:var(--err-bg);color:var(--err-txt);border-radius:var(--rs);padding:9px 12px;font-size:13px;margin-top:9px;display:none;line-height:1.5}
.link-btn{background:none;border:none;color:var(--acc);cursor:pointer;font-size:13px;padding:0;text-decoration:underline;text-underline-offset:2px}

/* ── CATEGORIES ── */
.cat-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r)}
.cat-bar-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;flex-shrink:0}
.cat-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr2);background:var(--surf2);color:var(--text);transition:all .15s;white-space:nowrap}
.cat-pill:hover{border-color:var(--acc);color:var(--acc)}.cat-pill.active{background:var(--acc);color:#000;border-color:var(--acc)}.cat-pill.all-pill.active{background:var(--text);color:var(--surf);border-color:var(--text)}
.cat-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--info-bg);color:var(--info-txt);border:1px solid var(--info-txt)}
.cat-tag .rm{cursor:pointer;opacity:.6;font-size:10px;margin-left:1px}.cat-tag .rm:hover{opacity:1}
.cat-panel{background:var(--surf2);border:1.5px solid var(--bdr2);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.cat-panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.cat-input-row{display:flex;gap:6px;margin-bottom:8px}
.cat-input{flex:1;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--surf);color:var(--text);padding:6px 9px;font-size:13px;font-family:inherit}
.cat-input:focus{outline:none;border-color:var(--acc)}
.cat-existing{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cat-existing-btn{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--bdr2);background:var(--surf);color:var(--text);cursor:pointer}
.cat-existing-btn:hover{border-color:var(--acc);color:var(--acc)}.cat-existing-btn.assigned{background:var(--info-bg);color:var(--info-txt);border-color:var(--info-txt)}
.rand-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rs);border:1px solid var(--bdr2);background:var(--surf2);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.rand-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}

/* ── BULK / ADMIN ── */

function toggleTryMenu(){

function updTryBtn(){var btn=document.getElementById('tryBtn');if(!btn)return;var st=getStats(S.activeTry);btn.textContent='Try '+S.activeTry+' ('+st.answered+'/'+QS.length+')';}
function setSS(ok,msg){var d=document.getElementById('syncDot'),t=document.getElementById('syncTxt');if(d)d.className='sync-dot '+(ok?'dot-ok':'dot-err');if(t)t.textContent=msg;}
function showErr(id,msg){var el=document.getElementById(id);if(el){el.textContent=msg;el.style.display='block';}}
function hideErr(id){var el=document.getElementById(id);if(el)el.style.display='none';}

// ── Repair questions that may have missing fields from DB ──────────────────
function repairQuestion(dbQ){
  // Normalise options: [{key:'A',text:'...'}] → {A:'...'} (AI often exports array format)
  if(dbQ&&Array.isArray(dbQ.options)&&dbQ.options.length&&dbQ.options[0]&&typeof dbQ.options[0]==='object'&&dbQ.options[0].key!==undefined){
    var _o={};dbQ.options.forEach(function(x){if(x.key)_o[x.key]=x.text||'';});dbQ.options=_o;
  }
  var seed=_SEED_QS.find(function(s){return s.id===dbQ.id;});
  if(!seed)return dbQ;
  var r=Object.assign({},dbQ);
  // Repair options for single/multi
  if((dbQ.type==='single'||dbQ.type==='multi')&&seed.options){
    if(!dbQ.options||typeof dbQ.options!=='object'||Object.keys(dbQ.options).length<2){
      r.options=seed.options;
      if(!r.correct||!r.correct.length)r.correct=seed.correct;
    }
  }
  // Repair items for ordering — CRITICAL for Q114
  if(dbQ.type==='ordering'){
    if(!dbQ.items||!Array.isArray(dbQ.items)||!dbQ.items.length){
      if(seed.items)r.items=seed.items;
      if(!r.correct||!r.correct.length)r.correct=seed.correct||seed.items;
    }
  }
  // Repair pairs for matching
  if(dbQ.type==='matching'){
    if(!dbQ.pairs||!Array.isArray(dbQ.pairs)||!dbQ.pairs.length){
      if(seed.pairs)r.pairs=seed.pairs;
      if(!r.options||!r.options.length)r.options=seed.options;
    }
  }
  return r;
}

function continueAsGuest(){
  IS_GUEST=true;USERID=null;USERNAME='guest';
  document.getElementById('authOverlay').style.display='none';
  document.getElementById('hdrEl').style.display='';
  QS=_SEED_QS.slice();
  (async function(){
    try{
      var edR=await SB.from('quiz_content').select('key,data').eq('key','exam_defs');
      if(!edR.error&&edR.data&&edR.data[0])examDefs=edR.data[0].data||[];
      if(!examDefs.length)examDefs=[{id:'default',provider:'AWS',name:'AI PRACTITIONER',totalQ:65,timeMins:90,passScore:700,scoreSystem:'aws',drawMode:'proportional'}];
      ACTIVE_EXAM=examDefs[0];updateLogoEl();
      await loadExamContent(ACTIVE_EXAM.id);
    }catch(e){console.warn('guest load:',e);if(!ACTIVE_EXAM)ACTIVE_EXAM={id:'default',provider:'AWS',name:'AI PRACTITIONER',totalQ:65,timeMins:90,passScore:700,scoreSystem:'aws',drawMode:'proportional'};}
    S.loaded=true;S.idx=0;updTryBtn();render();
  })();
}

function toggleMode(){
  AUTH_MODE=AUTH_MODE==='signin'?'signup':'signin';var s=AUTH_MODE==='signup';
  document.getElementById('authDesc').textContent=s?'Choose a username and password. No email needed.':'Sign in with your username and password.';
  document.getElementById('authBtn').textContent=s?'Create account \u2192':'Sign in \u2192';
  document.getElementById('authSwitch').textContent=s?'Already have an account? Sign in':'No account yet? Create one';
  hideErr('authErr');
}

async function doAuth(){
  var u=document.getElementById('authUser').value.trim(),p=document.getElementById('authPwd').value;
  hideErr('authErr');
  if(!u||u.length<2){showErr('authErr','Username must be at least 2 characters.');return;}
  if(!p||p.length<6){showErr('authErr','Password must be at least 6 characters.');return;}
  var btn=document.getElementById('authBtn');btn.disabled=true;btn.textContent='Please wait\u2026';
  var email=u.toLowerCase().replace(/[^a-z0-9_-]/g,'_')+'@awsquiz.app';
  try{
    var res;
    if(AUTH_MODE==='signup'){
      res=await SB.auth.signUp({email:email,password:p});
      if(res.error)throw res.error;
      if(!res.data.session){res=await SB.auth.signInWithPassword({email:email,password:p});if(res.error)throw res.error;}
    }else{
      res=await SB.auth.signInWithPassword({email:email,password:p});
      if(res.error){var m2=res.error.message;if(m2.includes('Invalid login')||m2.includes('invalid_grant'))m2='Wrong username or password.';throw new Error(m2);}
    }
    USERID=res.data.user.id;USERNAME=u;localStorage.setItem('quiz_username',u);
    document.getElementById('authOverlay').style.display='none';
    document.getElementById('hdrEl').style.display='';
    await startApp();
  }catch(e){showErr('authErr',e.message||'Something went wrong.');btn.disabled=false;btn.textContent=AUTH_MODE==='signup'?'Create account \u2192':'Sign in \u2192';}
}

async function signOut(){
  if(examInterval)clearInterval(examInterval);
  try{localStorage.removeItem('quiz_admin_'+(USERID||''));}catch(e){}await SB.auth.signOut();USERID=null;USERNAME=null;S=mkS();examDefs=[];ACTIVE_EXAM=null;progressData={};
  document.getElementById('hdrEl').style.display='none';document.getElementById('authOverlay').style.display='';
  AUTH_MODE='signin';
  document.getElementById('authDesc').textContent='Sign in with your username and password.';
  document.getElementById('authBtn').textContent='Sign in \u2192';document.getElementById('authBtn').disabled=false;
  document.getElementById('authSwitch').textContent='No account yet? Create one';
  document.getElementById('authUser').value=localStorage.getItem('quiz_username')||'';document.getElementById('authPwd').value='';
}

async function startApp(){setSS(false,'loading\u2026');await load();S.loaded=true;if(!ACTIVE_EXAM)ACTIVE_EXAM=examDefs[0];updateLogoEl();try{if(USERID&&localStorage.getItem('quiz_admin_'+USERID)==='1')S.adminMode=true;}catch(e){}var td=getTD();S.idx=0;for(var i=0;i<QS.length;i++){if(!td.answers[QS[i].id]){S.idx=i;break;}}updTryBtn();render();}

async function load(){
  // ── 1. Exam definitions ──────────────────────────────────────────────────
  try{
    var edRes=await SB.from('quiz_content').select('key,data').eq('key','exam_defs');
    if(!edRes.error&&edRes.data&&edRes.data[0])examDefs=edRes.data[0].data||[];
  }catch(e){console.warn('examDefs load:',e);}
  if(!examDefs.length){
    examDefs=[{id:'default',provider:'AWS',name:'AI PRACTITIONER',totalQ:65,timeMins:90,passScore:700,scoreSystem:'aws',drawMode:'proportional'}];
    try{await SB.from('quiz_content').upsert([{key:'exam_defs',data:examDefs,updated_at:new Date().toISOString()}]);}catch(e){}
  }
  // ── 2. User progress ─────────────────────────────────────────────────────
  try{
    var r=await SB.from('quiz_progress').select('data').eq('user_id',USERID).single();
    if(r.error&&r.error.code!=='PGRST116')throw r.error;
    if(r.data&&r.data.data){
      var pd=r.data.data;
      // Migrate old format (flat tries) → perExam structure
      if(pd.tries&&!pd.perExam){pd={perExam:{default:{tries:pd.tries,activeTry:pd.activeTry||1,examAttempts:pd.exams||[]}}};}
      progressData=pd;
    }
    setSS(true,'synced \u2713');
  }catch(e){console.warn('progress load:',e);setSS(false,'offline');}
  // ── 3. Active exam + content ──────────────────────────────────────────────
  var _lastId=progressData.lastExamId;
  var _lastExam=_lastId?examDefs.find(function(e){return e.id===_lastId;}):null;
  ACTIVE_EXAM=_lastExam||examDefs[0];
  var ep=progressData.perExam&&progressData.perExam[ACTIVE_EXAM.id];
  if(ep){S.tries=ep.tries||[];S.activeTry=ep.activeTry||1;S.exams=ep.examAttempts||[];}
  if(progressData.adminMode)S.adminMode=true;
  await loadExamContent(ACTIVE_EXAM.id);
}

async function loadExamContent(examId){
  var def=examId==='default';
  var qK=def?'questions':'exam_'+examId+'_questions';
  var eK=def?'explanations':'exam_'+examId+'_explanations';
  var cK=def?'corrections':'exam_'+examId+'_corrections';
  var catK=def?'categories':'exam_'+examId+'_categories';
  QS=[];S.explanations={};S.corrections={};S.categories={};S.categoryList=[];S.cache={};
  try{
    var rc=await SB.from('quiz_content').select('key,data').in('key',[qK,eK,cK,catK]);
    if(!rc.error&&rc.data){
      rc.data.forEach(function(row){
        if(row.key===qK){QS=(row.data&&row.data.length)?row.data.map(repairQuestion):(def?_SEED_QS.slice():[]);QS.sort(function(a,b){return a.id-b.id;});}
        if(row.key===eK){Object.keys(row.data||{}).forEach(function(k){var n=parseInt(k);S.explanations[n]=row.data[k];S.cache[n]=row.data[k];});}
        if(row.key===cK){S.corrections=row.data||{};}
        if(row.key===catK){S.categories=row.data.categories||{};S.categoryList=row.data.categoryList||[];}
      });
      if(!QS.length&&def)QS=_SEED_QS.slice();
    }else if(def){QS=_SEED_QS.slice();}
  }catch(e){console.warn('content load:',e);if(def)QS=_SEED_QS.slice();}
}

async function dbsave(){
  if(!SB||!USERID||IS_GUEST)return;
  try{
    if(!progressData.perExam)progressData.perExam={};
    progressData.lastExamId=ACTIVE_EXAM?ACTIVE_EXAM.id:'default';
    if(S.adminMode)progressData.adminMode=true;else delete progressData.adminMode;
    var eid=ACTIVE_EXAM?ACTIVE_EXAM.id:'default';
    progressData.perExam[eid]={tries:S.tries,activeTry:S.activeTry,examAttempts:S.exams};
    var r=await SB.from('quiz_progress').upsert({user_id:USERID,data:progressData,updated_at:new Date().toISOString()});
    if(r.error)throw r.error;setSS(true,'saved \u2713');
  }catch(e){setSS(false,'save failed');}
}

async function saveContent(){
  if(!SB)return false;
  try{
    var def=!ACTIVE_EXAM||ACTIVE_EXAM.id==='default';
    var eid=ACTIVE_EXAM?ACTIVE_EXAM.id:'default';
    var qK=def?'questions':'exam_'+eid+'_questions';
    var eK=def?'explanations':'exam_'+eid+'_explanations';
    var cK=def?'corrections':'exam_'+eid+'_corrections';
    var catK=def?'categories':'exam_'+eid+'_categories';
    var expObj={};Object.keys(S.explanations).forEach(function(k){expObj[k]=S.explanations[k];});
    await SB.from('quiz_content').upsert([
      {key:qK,data:QS,updated_at:new Date().toISOString()},
      {key:eK,data:expObj,updated_at:new Date().toISOString()},
      {key:cK,data:S.corrections,updated_at:new Date().toISOString()},
      {key:catK,data:{categories:S.categories,categoryList:S.categoryList},updated_at:new Date().toISOString()}
    ]);
    return true;
  }catch(e){console.error('saveContent:',e);return false;}
}
function sched(){clearTimeout(saveTimer);setSS(true,'saving\u2026');saveTimer=setTimeout(dbsave,900);}

// ── State ─────────────────────────────────────────────────────────────────
function mkS(){return{idx:0,sel:null,matchSel:{},orderItems:null,revealed:false,expl:null,loading:false,
  view:'quiz',tries:[],activeTry:1,loaded:false,cache:{},focusFilter:'all',focusSort:'miss',
  exams:[],retryMode:false,retryQueue:[],retryIdx:0,retrySel:null,retryMatchSel:{},retryOrderItems:null,retryRevealed:false,
  exam:null,explanations:{},adminMode:false,corrections:{},
  categories:{},categoryList:[],activeCat:'all',catPanelOpen:null};}
var S=mkS();

function getTD(){var t=S.tries.find(function(t){return t.tryNum===S.activeTry;});if(!t){t={tryNum:S.activeTry,date:new Date().toLocaleDateString('en-GB'),answers:{}};S.tries.push(t);}return t;}
function getStats(tn){var t=S.tries.find(function(t){return t.tryNum===tn;});if(!t)return{answered:0,correct:0,incorrect:0,pct:0};var a=Object.keys(t.answers).length,ok=0;Object.entries(t.answers).forEach(function(kv){var q=QS.find(function(q){return q.id===parseInt(kv[0]);});if(q&&isOK(q,kv[1]))ok++;});return{answered:a,correct:ok,incorrect:a-ok,pct:a?Math.round(ok/a*100):0};}
function isOK(q,ans){
  if(q.type==='single'||q.type==='truefalse')return Array.isArray(ans)?ans[0]===q.correct[0]:ans===q.correct[0];
  if(q.type==='multi'){var a=[].concat(ans).sort(),c=[].concat(q.correct).sort();return JSON.stringify(a)===JSON.stringify(c);}
  if(q.type==='matching')return q.pairs.every(function(p,i){return ans[i]===p.correct;});
  if(q.type==='ordering'){var ci=q.items||q.correct||[];return Array.isArray(ans)&&ans.length===ci.length&&ans.every(function(item,i){return item===ci[i];});}
  return false;
}
function maxT(){return Math.max.apply(null,S.tries.map(function(t){return t.tryNum;}).concat([1]));}
function switchTry(v){S.activeTry=parseInt(v);S.retryMode=false;var td=getTD();S.idx=0;for(var i=0;i<QS.length;i++){if(!td.answers[QS[i].id]){S.idx=i;break;}}rst();sched();updTryBtn();render();}
function newTry(){S.activeTry=maxT()+1;S.idx=0;S.view='quiz';S.retryMode=false;rst();sched();updTryBtn();render();}
function setView(v){S.view=v;S.retryMode=false;render();}
function goTo(idx){S.idx=idx;S.retryMode=false;rst();render();}

// ── Fix: rst() handles ordering with items fallback ───────────────────────
function rst(){
  S.sel=null;S.matchSel={};S.orderItems=null;S.revealed=false;S.expl=null;S.loading=false;S.catPanelOpen=null;
  var q=QS[S.idx];if(!q)return;
  var prev=getTD().answers[q.id];
  if(prev){
    if(q.type==='single'||q.type==='multi'||q.type==='truefalse')S.sel=prev;
    else if(q.type==='matching')S.matchSel=JSON.parse(JSON.stringify(prev));
    else if(q.type==='ordering')S.orderItems=prev.slice();
    S.revealed=true;if(S.cache[q.id])S.expl=S.cache[q.id];
  }else{
    if(q.type==='ordering'){
      var oi=q.items||q.correct||[];
      S.orderItems=oi.slice();
    }
  }
}

function startRetry(queueIdxs){
  if(!queueIdxs||!queueIdxs.length)return;
  S.retryMode=true;S.retryQueue=queueIdxs;S.retryIdx=0;
  S.retrySel=null;S.retryMatchSel={};S.retryOrderItems=null;S.retryRevealed=false;
  var q=QS[queueIdxs[0]];if(q&&q.type==='ordering'){var ri=q.items||q.correct||[];S.retryOrderItems=ri.slice();}
  S.view='quiz';render();
}
function retrySubmit(){
  var qi=S.retryQueue[S.retryIdx];var q=QS[qi];var ans=null;
  if(q.type==='single'||q.type==='multi'){if(!S.retrySel||(Array.isArray(S.retrySel)&&!S.retrySel.length))return;ans=S.retrySel;}
  else if(q.type==='matching'){if(Object.keys(S.retryMatchSel).length<q.pairs.length)return;ans=JSON.parse(JSON.stringify(S.retryMatchSel));}
  else if(q.type==='ordering'){ans=S.retryOrderItems.slice();}
  S.retryRevealed=true;render();
}
function retryNext(){
  S.retryIdx++;
  if(S.retryIdx>=S.retryQueue.length){S.retryMode=false;setView('focus');return;}
  var q=QS[S.retryQueue[S.retryIdx]];
  S.retrySel=null;S.retryMatchSel={};S.retryOrderItems=null;S.retryRevealed=false;
  if(q&&q.type==='ordering'){var ri=q.items||q.correct||[];S.retryOrderItems=ri.slice();}
  render();
}
function canRetrySubmit(q){
  if(q.type==='single'||q.type==='truefalse')return!!S.retrySel;
  if(q.type==='multi')return Array.isArray(S.retrySel)&&S.retrySel.length>0;
  if(q.type==='matching')return Object.keys(S.retryMatchSel).length===q.pairs.length;
  if(q.type==='ordering'){var len=(q.items||q.correct||[]).length;return!!S.retryOrderItems&&S.retryOrderItems.length===len&&len>0;}
  return false;
}

// ── Categories ────────────────────────────────────────────────────────────
function getCats(qid){return S.categories[qid]||[];}
function hasCat(qid,cat){return getCats(qid).includes(cat);}

function removeCat(qid,cat){if(!S.categories[qid])return;S.categories[qid]=S.categories[qid].filter(function(c){return c!==cat;});if(S.categories[qid].length===0)delete S.categories[qid];saveContent();render();}
function deleteCat(cat){Object.keys(S.categories).forEach(function(qid){S.categories[qid]=S.categories[qid].filter(function(c){return c!==cat;});if(S.categories[qid].length===0)delete S.categories[qid];});S.categoryList=S.categoryList.filter(function(c){return c!==cat;});if(S.activeCat===cat)S.activeCat='all';saveContent();render();}
function toggleCatPanel(qid){S.catPanelOpen=(S.catPanelOpen===qid)?null:qid;render();}
function getFilteredQS(){if(!S.activeCat||S.activeCat==='all')return QS;return QS.filter(function(q){return hasCat(q.id,S.activeCat);});}
function getFilteredIdx(){var fqs=getFilteredQS();var q=QS[S.idx];var fi=fqs.findIndex(function(qq){return qq.id===q.id;});return{fqs:fqs,fi:fi};}
function goRandom(){var td=getTD();var fqs=getFilteredQS();var un=fqs.filter(function(q){return!td.answers[q.id];});if(!un.length)un=fqs;if(!un.length)return;var pick=un[Math.floor(Math.random()*un.length)];var gi=QS.findIndex(function(q){return q.id===pick.id;});if(gi>=0)goTo(gi);}
function deleteQuestion(qid){if(!confirm('Delete Q'+qid+' permanently?'))return;QS=QS.filter(function(q){return q.id!==qid;});delete S.categories[qid];delete S.explanations[qid];delete S.cache[qid];if(S.idx>=QS.length)S.idx=Math.max(0,QS.length-1);saveContent().then(function(ok){if(!ok)alert('\u26a0 Deleted locally but cloud sync failed.');});render();}

// ── Bulk label ────────────────────────────────────────────────────────────
function toggleBulkMode(){S.bulkMode=!S.bulkMode;S.bulkSel=new Set();render();}
function toggleBulkQ(qid){if(S.bulkSel.has(qid))S.bulkSel.delete(qid);else S.bulkSel.add(qid);render();}
function selectAllVisible(qids){var allSel=qids.every(function(id){return S.bulkSel.has(id);});if(allSel)qids.forEach(function(id){S.bulkSel.delete(id);});else qids.forEach(function(id){S.bulkSel.add(id);});render();}
function applyBulkCat(cat){cat=(cat||'').trim();if(!cat||!S.bulkSel.size)return;S.bulkSel.forEach(function(qid){addCat(qid,cat);});sched();render();}
function removeBulkCat(cat){if(!cat||!S.bulkSel.size)return;S.bulkSel.forEach(function(qid){removeCat(qid,cat);});sched();render();}

// ── Submit ────────────────────────────────────────────────────────────────
function submit(){
  var q=QS[S.idx];if(S.revealed)return;var ans=null;
  if(q.type==='single'||q.type==='multi'||q.type==='truefalse'){if(!S.sel||(Array.isArray(S.sel)&&!S.sel.length))return;ans=S.sel;}
  else if(q.type==='matching'){if(Object.keys(S.matchSel).length<q.pairs.length)return;ans=JSON.parse(JSON.stringify(S.matchSel));}
  else if(q.type==='ordering'){ans=S.orderItems.slice();}
  getTD().answers[q.id]=ans;sched();updTryBtn();S.revealed=true;
  var cached=S.cache[q.id]||S.explanations[q.id];
  if(cached){S.expl=cached;S.cache[q.id]=cached;}else{S.expl=null;}
  S.loading=false;render();
}
function seeExpl(){var q=QS[S.idx];var cached=S.cache[q.id]||S.explanations[q.id];if(cached){S.expl=cached;S.cache[q.id]=cached;}S.loading=false;render();}

  S.loading=false;S.expl=null;render();

// ── Mock exam ─────────────────────────────────────────────────────────────
var EXAM_SECS=5400;
function buildExamQuestions(){
  var exam=ACTIVE_EXAM||{totalQ:65,drawMode:'proportional'};
  var allowed=exam.allowedTypes||['single','multi','truefalse','matching','ordering'];
  if(exam.drawMode==='proportional'){
    var targets={single:58,multi:2,matching:4,ordering:1};var result=[];
    Object.keys(targets).forEach(function(t){
      if(allowed.indexOf(t)<0)return;
      var pool=QS.filter(function(q){return q.type===t;}).slice();
      pool.sort(function(){return Math.random()-.5;});result=result.concat(pool.slice(0,targets[t]));
    });
    result.sort(function(){return Math.random()-.5;});return result;
  }
  var pool=QS.filter(function(q){return allowed.indexOf(q.type)>=0;}).sort(function(){return Math.random()-.5;});
  return pool.slice(0,Math.min(exam.totalQ||pool.length,pool.length));
}
function startExam(customQids,opts){
  if(examInterval)clearInterval(examInterval);
  var shuffle=opts?opts.shuffle!==false:true;
  var setName=opts?opts.setName||null:null;
  var qs;
  if(customQids){
    qs=QS.filter(function(q){return customQids.indexOf(q.id)>=0;});
    if(shuffle)qs=qs.slice().sort(function(){return Math.random()-.5;});
    else qs=qs.slice().sort(function(a,b){return customQids.indexOf(a.id)-customQids.indexOf(b.id);});
  }else{qs=buildExamQuestions();}
  var secs=(ACTIVE_EXAM?ACTIVE_EXAM.timeMins:90)*60;
  S.exam={questions:qs,answers:{},flagged:{},idx:0,startTime:Date.now(),submitted:false,sel:null,matchSel:{},orderItems:null,secs:secs,setName:setName,isReview:false};
  S.view='exam';render();examInterval=setInterval(tickExamTimer,1000);
}
function tickExamTimer(){if(!S.exam||S.exam.submitted){clearInterval(examInterval);return;}var elapsed=Math.floor((Date.now()-S.exam.startTime)/1000);var rem=Math.max(0,(S.exam.secs||EXAM_SECS)-elapsed);var el=document.getElementById('examTimerEl');if(el){var m=Math.floor(rem/60),s=rem%60;el.textContent=m+':'+(s<10?'0':'')+s;el.className='exam-timer'+(rem<300?' crit':rem<600?' warn':'');}if(rem===0)submitExam(true);}
function examGoTo(idx){saveExamCurrentAnswer();S.exam.idx=idx;var q=S.exam.questions[idx];S.exam.sel=S.exam.answers[q.id]||null;S.exam.matchSel=S.exam.answers[q.id]?JSON.parse(JSON.stringify(S.exam.answers[q.id])):{};var qi=q.items||q.correct||[];S.exam.orderItems=S.exam.answers[q.id]?S.exam.answers[q.id].slice():(q.type==='ordering'?qi.slice():null);render();}
function saveExamCurrentAnswer(){if(!S.exam||S.exam.submitted)return;var q=S.exam.questions[S.exam.idx];if(!q)return;if((q.type==='single'||q.type==='multi'||q.type==='truefalse')&&S.exam.sel&&S.exam.sel.length)S.exam.answers[q.id]=S.exam.sel.slice();else if(q.type==='matching'&&Object.keys(S.exam.matchSel).length===q.pairs.length)S.exam.answers[q.id]=JSON.parse(JSON.stringify(S.exam.matchSel));else if(q.type==='ordering'&&S.exam.orderItems)S.exam.answers[q.id]=S.exam.orderItems.slice();}
function submitExam(auto){
  saveExamCurrentAnswer();
  if(!auto){var un=S.exam.questions.filter(function(q){return!S.exam.answers[q.id];}).length;if(!confirm(un>0?'You have '+un+' unanswered question'+(un>1?'s':'')+'. Submit anyway?':'Submit the exam now?'))return;}
  clearInterval(examInterval);S.exam.submitted=true;
  var correct=0,total=S.exam.questions.length;S.exam.questions.forEach(function(q){if(S.exam.answers[q.id]&&isOK(q,S.exam.answers[q.id]))correct++;});
  var elapsed=Math.floor((Date.now()-S.exam.startTime)/1000);
  var _ex=ACTIVE_EXAM||{scoreSystem:'aws',passScore:700,scoreMax:1000};
  var score;
  if(_ex.scoreSystem==='percent')score=Math.round(correct/total*100);
  else if(_ex.scoreSystem==='custom')score=Math.round(correct/total*(_ex.scoreMax||1000));
  else score=Math.round(100+(correct/total)*900);
  var passed=score>=_ex.passScore;
  S.exams.push({date:new Date().toLocaleDateString('en-GB'),score:score,passed:passed,correct:correct,total:total,elapsed:elapsed,answers:JSON.parse(JSON.stringify(S.exam.answers)),qids:S.exam.questions.map(function(q){return q.id;}),setName:S.exam.setName||null});
  sched();render();
}
function exitExam(){if(S.exam&&S.exam.isReview){clearInterval(examInterval);S.exam=null;setView('examSetup');return;}if(!confirm('Exit exam? Progress will not be saved.'))return;clearInterval(examInterval);S.exam=null;setView('examSetup');}

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qa(s){return String(s||'').replace(/'/g,'&#39;');}
function badge(t){var m={single:['Single','tb-s'],multi:['Multi','tb-m'],truefalse:['T/F','tb-s'],matching:['Matching','tb-match'],ordering:['Ordering','tb-ord']};var v=m[t]||['?','tb-s'];return '<span class="tbadge '+v[1]+'">'+v[0]+'</span>';}
// ── Fix: canSub handles ordering with items fallback ──────────────────────
function canSub(q){
  if(q.type==='single'||q.type==='truefalse')return!!S.sel;
  if(q.type==='multi')return Array.isArray(S.sel)&&S.sel.length>0;
  if(q.type==='matching')return Object.keys(S.matchSel).length===q.pairs.length;
  if(q.type==='ordering'){var len=(q.items||q.correct||[]).length;return!!S.orderItems&&S.orderItems.length===len&&len>0;}
  return false;
}
function fmtTime(secs){var m=Math.floor(secs/60),s=secs%60;return m+'m '+(s<10?'0':'')+s+'s';}

// ── Nav active tab update ─────────────────────────────────────────────────
function updateNavTabs(){
  updateLogoEl();var map={quiz:'hnav-quiz',stats:'hnav-stats',focus:'hnav-focus',examSetup:'hnav-examSetup',exam:'hnav-examSetup',sync:'hnav-sync'};
  ['hnav-quiz','hnav-stats','hnav-focus','hnav-examSetup','hnav-sync'].forEach(function(id){var el=document.getElementById(id);if(el)el.classList.remove('hnav-act');});
  var aid=map[S.view]||'hnav-quiz';
  var ael=document.getElementById(aid);if(ael)ael.classList.add('hnav-act');
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  var m=document.getElementById('main');if(!m||!S.loaded)return;
  updateNavTabs(); // always update nav highlight on every render
  if(S.view==='stats'){rStats(m);return;}
  if(S.view==='focus'){rFocus(m);return;}
  if(S.view==='sync'){rSync(m);return;}
  if(S.view==='examSetup'){rExamSetup(m);return;}
  if(S.view==='exam'){rExam(m);return;}
  if(S.retryMode){rRetry(m);return;}
  rQuiz(m);
}

function rQuiz(m){
  var q=QS[S.idx],td=getTD(),st=getStats(S.activeTry);
  var f=getFilteredIdx(),fqs=f.fqs,fi=f.fi;
  var totalQ=fqs.length,ansCount=fqs.filter(function(qq){return td.answers[qq.id];}).length,unansweredCount=totalQ-ansCount;
  var pct=totalQ>0?Math.round((fi+1)/totalQ*100):0;
  var isAns=!!td.answers[q?q.id:0],locked=S.revealed||isAns;
  var nCls='btn-nav'+(S.revealed||isAns?' btn-nav-next':'');
  var prevQ=fi>0?QS.findIndex(function(qq){return qq.id===fqs[fi-1].id;}):null;
  var nextQ=fi<fqs.length-1?QS.findIndex(function(qq){return qq.id===fqs[fi+1].id;}):null;
  var h='';
  if(IS_GUEST){h+='<div class="guest-banner"><span style="font-size:20px">&#128100;</span><div class="guest-banner-txt"><strong>Browsing as guest.</strong> Progress is not saved. <a href="#" onclick="IS_GUEST=false;document.getElementById(\'hdrEl\').style.display=\'none\';document.getElementById(\'authOverlay\').style.display=\'\';event.preventDefault()" style="color:var(--acc);font-weight:700">Sign in</a> to track results.</div></div>';}
  if(S.categoryList&&S.categoryList.length){h+='<div class="cat-bar"><span class="cat-bar-label">&#127991; Filter:</span><span class="cat-pill all-pill'+(S.activeCat==='all'?' active':'')+'" onclick="S.activeCat=\'all\';S.idx=0;rst();render()">All ('+QS.length+')</span>';S.categoryList.forEach(function(cat){var cnt=QS.filter(function(qq){return hasCat(qq.id,cat);}).length;h+='<span class="cat-pill'+(S.activeCat===cat?' active':'')+'" onclick="S.activeCat=\''+cat.replace(/'/g,"\'")+'\';;var first=getFilteredQS()[0];if(first){S.idx=QS.findIndex(function(qq){return qq.id===first.id;});}rst();render()">'+esc(cat)+' ('+cnt+')</span>';});h+='</div>';}
  if(!totalQ){m.innerHTML=h+'<div class="empty">No questions in this category yet.</div>';return;}
  h+='<div class="prog-wrap"><div class="prog-meta"><span>Q <strong>'+(fi+1)+'</strong> / '+totalQ+(S.activeCat!=='all'?' <span style="font-size:10px;color:var(--info-txt)">['+esc(S.activeCat)+']</span>':'')+'</span><span style="display:flex;align-items:center;gap:6px">'+ansCount+' answered <button class="rand-btn" onclick="goRandom()">&#127922; Random'+(unansweredCount>0?' ('+unansweredCount+')':'')+'</button></span></div><div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div></div>';
  h+='<div class="nav-bar"><div class="nav-prev"><button class="btn-nav"'+(fi===0?' disabled':'')+' onclick="goTo('+(prevQ!==null?prevQ:0)+')">&#8592; Prev</button></div><div class="nav-stats"><span class="pill pill-ok">&#10003; '+st.correct+'</span><span class="pill pill-err">&#10007; '+st.incorrect+'</span><span class="pill pill-neu">'+unansweredCount+' left</span></div><div class="nav-next"><button class="btn-nav '+nCls+'"'+(fi===fqs.length-1?' disabled':'')+' onclick="goTo('+(nextQ!==null?nextQ:QS.length-1)+')">Next &#8594;</button></div></div>';
  if(!q){m.innerHTML=h+'<div class="empty">No question.</div>';return;}
  var q=getQ(QS[S.idx]);
  h+='<div class="card">';
  var qCats=getCats(q.id);
  var catTagsHtml=qCats.map(function(c){var sc=c.replace(/'/g,'&#39;');var rmBtn=S.adminMode?'<span class="rm" onclick="removeCat('+q.id+',"'+sc+'")" title="Remove">&#215;</span>':'';return '<span class="cat-tag">'+esc(c)+rmBtn+'</span>';}).join(' ');
  h+='<div class="qnum">Q'+q.id+' '+badge(q.type);
  if(S.adminMode){h+=' <button class="rand-btn" style="padding:2px 7px;font-size:11px;margin-left:4px;'+(S.catPanelOpen===q.id?'border-color:var(--acc);color:var(--acc);background:var(--acc-bg)':'')+'" onclick="toggleCatPanel('+q.id+')" title="Tag">&#127991; Tag'+(qCats.length?' ('+qCats.length+')':'')+'</button><button class="btn" style="font-size:11px;padding:2px 7px;color:var(--acc);border-color:var(--acc)" onclick="openEditModal('+q.id+')">&#9999; Edit</button><button class="btn" style="font-size:11px;padding:2px 7px;color:var(--err-txt);border-color:var(--err)" onclick="deleteQuestion('+q.id+')">&#128465;</button>';}
  h+='</div>';
  if(qCats.length)h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">'+catTagsHtml+'</div>';
  if(S.adminMode&&S.catPanelOpen===q.id){h+='<div class="cat-panel"><div class="cat-panel-title">&#127991; Assign category</div><div class="cat-input-row"><input class="cat-input" id="catNewInput" type="text" placeholder="New category name&#8230;" onkeydown="if(event.key===\'Enter\'){var v=document.getElementById(\'catNewInput\').value;addCat('+q.id+',v)}"><button class="btn btn-pri" onclick="var v=document.getElementById(\'catNewInput\').value;addCat('+q.id+',v)">Add</button></div>';if(S.categoryList.length){h+='<div style="font-size:11px;color:var(--muted);margin-bottom:5px">Existing \u2014 click to toggle:</div><div class="cat-existing">';S.categoryList.forEach(function(cat){var assigned=hasCat(q.id,cat);h+='<button class="cat-existing-btn'+(assigned?' assigned':'')+'" onclick="'+(assigned?'removeCat':'addCat')+'('+q.id+',\''+cat.replace(/'/g,"\'")+'\')">'+esc(cat)+(assigned?' &#10003;':'')+'</button>';});h+='</div>';}h+='</div>';}
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.type==='single')h+=rSingle(q,locked,td.answers[q.id]);
  else if(q.type==='multi')h+=rMulti(q,locked,td.answers[q.id]);
  else if(q.type==='truefalse')h+=rTrueFalse(q,locked,td.answers[q.id]);
  else if(q.type==='matching')h+=rMatch(q,locked,td.answers[q.id]);
  else if(q.type==='ordering')h+=rOrder(q,locked,td.answers[q.id]);

    var ua=isAns?td.answers[q.id]:(q.type==='matching'?S.matchSel:q.type==='ordering'?S.orderItems:S.sel);var ok=isOK(q,ua);
    if(q.type==='single'||q.type==='multi'||q.type==='truefalse'){var da=Array.isArray(ua)?ua.join(', '):String(ua||'');h+=ok?'<div class="banner ban-ok">&#10003; Correct! You answered: <strong>'+esc(da)+'</strong></div>':'<div class="banner ban-err">&#10007; Incorrect. You chose: <strong>'+esc(da)+'</strong> &middot; Correct: <strong>'+esc(q.correct.join(', '))+'</strong></div>';}
    else{h+=ok?'<div class="banner ban-ok">&#10003; Correct!</div>':'<div class="banner ban-err">&#10007; Incorrect &mdash; see below.</div>';}
    h+=rExpl(q);
  }
  if(isAns&&!S.revealed)h+='<button class="btn" style="margin-bottom:10px;width:100%" onclick="seeExpl()">See Explanation</button>';
  if(!isAns&&!S.revealed)h+='<button class="btn-acc" onclick="submit()"'+(canSub(q)?'':' disabled')+'>Submit Answer</button>';
  h+='<div style="display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px"><span style="font-size:12px;color:var(--muted)">Jump:</span><input class="jmp" type="number" min="1" max="'+QS.length+'" value="'+(S.idx+1)+'" id="jmpI" onkeydown="if(event.key===\'Enter\'){var v=parseInt(this.value)-1;if(v>=0&&v<'+QS.length+')goTo(v)}"><span style="font-size:12px;color:var(--muted)">/'+QS.length+'</span><button class="btn" onclick="var v=parseInt(document.getElementById(\'jmpI\').value)-1;if(v>=0&&v<'+QS.length+')goTo(v)">Go</button></div>';
  m.innerHTML=h;
  if(q.type==='ordering')attachDrag(q,false);
}

function rRetry(m){
  var qi=S.retryQueue[S.retryIdx],q=QS[qi],td=getTD(),origAns=td.answers[q.id];
  var h='<div class="banner ban-info" style="margin-bottom:14px">&#128260; Retry: Q'+(S.retryIdx+1)+' of '+S.retryQueue.length+' <button class="btn" style="margin-left:auto" onclick="S.retryMode=false;setView(\'focus\')">Exit</button></div>';
  h+='<div class="card"><div class="qnum">Q'+q.id+' '+badge(q.type)+'</div><div class="stem">'+esc(q.stem)+'</div>';
  if(!S.retryRevealed){
    if(q.type==='single')h+=rRetryOpts(q);else if(q.type==='multi')h+=rRetryMultiOpts(q);else if(q.type==='truefalse')h+=rRetryTrueFalse(q);else if(q.type==='matching')h+=rRetryMatchOpts(q);else if(q.type==='ordering')h+=rRetryOrderOpts(q);
    h+='</div><button class="btn-acc" onclick="retrySubmit()"'+(canRetrySubmit(q)?'':' disabled')+'>Check my answer</button>';
  }else{
    var ra=S.retrySel||(q.type==='matching'?S.retryMatchSel:q.type==='ordering'?S.retryOrderItems:null);var retryOK=isOK(q,ra);
    if(q.type==='single'){var uaR=Array.isArray(S.retrySel)?S.retrySel[0]:S.retrySel;h+=rLockedOpts(q,uaR);}
    else if(q.type==='multi'){h+=rLockedMultiOpts(q,S.retrySel||[]);}
    else if(q.type==='truefalse'){h+=rTrueFalse(q,true,S.retrySel);}
    else if(q.type==='matching')h+=rMatch(q,true,S.retryMatchSel);
    else if(q.type==='ordering')h+=rOrder(q,true,S.retryOrderItems);
    h+='</div>';
    if(retryOK){h+='<div class="banner ban-ok">&#10003; Retry correct!</div>';}
    else{var origDA=Array.isArray(origAns)?origAns.join(', '):String(origAns||'?');var retDA=Array.isArray(ra)?ra.join(', '):String(ra||'?');h+='<div class="banner ban-err">&#10007; Retry wrong.<br><span style="font-size:12px;font-weight:400">Your retry: <strong>'+esc(retDA)+'</strong> &middot; Original: <strong>'+esc(origDA)+'</strong> &middot; Correct: <strong>'+esc(q.correct&&q.correct.join?q.correct.join(', '):q.correct)+'</strong></span></div>';}
    var isLast=S.retryIdx>=S.retryQueue.length-1;
    h+='<button class="btn-acc" onclick="retryNext()">'+(isLast?'Finish retry':'Next &#8594;')+'</button>';
  }
  m.innerHTML=h;if(q.type==='ordering'&&!S.retryRevealed)attachDrag(q,true);
}

function rRetryOpts(q){var sel=S.retrySel;var ua=Array.isArray(sel)?sel[0]:(sel||null);var h='';Object.entries(q.options).forEach(function(kv){var L=kv[0],cls='opt'+(L===ua?' sel':'');h+='<div class="'+cls+'" data-icon="'+L+'" onclick="S.retrySel=[\''+qa(L)+'\'];render()">'+esc(kv[1])+'</div>';});return h;}
function rRetryMultiOpts(q){var ua=Array.isArray(S.retrySel)?S.retrySel:[];var n=q.correct.length;var h='<div class="mhint">Select <strong>'+n+'</strong> answer'+(n>1?'s':'')+'</div>';Object.entries(q.options).forEach(function(kv){var L=kv[0],cls='opt'+(ua.includes(L)?' sel':''),icon=ua.includes(L)?'&#10003;':L;h+='<div class="'+cls+'" data-icon="'+icon+'" onclick="var a=S.retrySel?S.retrySel.slice():[];var i=a.indexOf(\''+qa(L)+'\');if(i>=0)a.splice(i,1);else a.push(\''+qa(L)+'\');S.retrySel=a;render()">'+esc(kv[1])+'</div>';});return h;}
function rRetryMatchOpts(q){var us=S.retryMatchSel,h='<table class="mtbl">';q.pairs.forEach(function(p,i){var ch=us[i]||'';h+='<tr><td class="mdesc">'+esc(p.description)+'</td><td class="mico"></td><td class="msel"><select onchange="S.retryMatchSel['+i+']=this.value;render()"><option value="">Select&#8230;</option>'+q.options.map(function(o){return '<option value="'+qa(o)+'"'+(ch===o?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select></td></tr>';});return h+'</table>';}
function rRetryOrderOpts(q){var ci=q.items||q.correct||[];var items=S.retryOrderItems||ci.slice(),h='<ul class="olist" id="OL">';items.forEach(function(item,i){h+='<li class="oitem" draggable="true" data-i="'+i+'"><div class="onum">'+(i+1)+'</div><div class="ogrip">&#10240; </div><div class="otxt2">'+esc(item)+'</div></li>';});return h+'</ul><p style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center">Drag items into the correct order</p>';}
function rLockedOpts(q,ua){var h='';Object.entries(q.options).forEach(function(kv){var L=kv[0],cls='opt';if(L===q.correct[0])cls+=' rev-ok';else if(L===ua)cls+=' rev-wrong';else cls+=' rev-skip';h+='<div class="'+cls+'" data-icon="'+L+'">'+esc(kv[1])+'</div>';});return h;}
function rLockedMultiOpts(q,ua){var n=q.correct.length,h='<div class="mhint">Select <strong>'+n+'</strong> answer'+(n>1?'s':'')+'</div>';Object.entries(q.options).forEach(function(kv){var L=kv[0],cls='opt';if(q.correct.includes(L))cls+=' rev-ok';else if(ua.includes(L))cls+=' rev-wrong';else cls+=' rev-skip';h+='<div class="'+cls+'" data-icon="'+L+'">'+esc(kv[1])+'</div>';});return h;}

function rTrueFalse(q,locked,prevAns){
  var raw=prevAns||S.sel,ua=Array.isArray(raw)?raw[0]:(raw||null);
  var correct=q.correct?q.correct[0]:'True';
  var h='<div class="tf-wrap">';
  ['True','False'].forEach(function(v){
    var cls='tf-btn';
    if(locked){if(v===correct)cls+=' tf-ok';else if(v===ua)cls+=' tf-wrong';else cls+=' tf-skip';}
    else if(v===ua)cls+=' tf-sel';
    h+='<div class="'+cls+'"'+(locked?'':' onclick="S.sel=[\''+v+'\']; render()"')+'>'+v+'</div>';
  });
  return h+'</div>';
}
function rRetryTrueFalse(q){
  var sel=S.retrySel,ua=Array.isArray(sel)?sel[0]:(sel||null);
  var h='<div class="tf-wrap">';
  ['True','False'].forEach(function(v){
    var cls='tf-btn'+(v===ua?' tf-sel':'');
    h+='<div class="'+cls+'" onclick="S.retrySel=[\''+v+'\']; render()">'+v+'</div>';
  });
  return h+'</div>';
}

// ── Fix: attachDrag null-safe ─────────────────────────────────────────────
function attachDrag(q,isRetry){
  var list=document.getElementById('OL');if(!list)return;
  var correctItems=q.items||q.correct||[];
  var dragIdx=null;
  list.querySelectorAll('li').forEach(function(li){
    li.addEventListener('dragstart',function(){dragIdx=+li.dataset.i;li.classList.add('dragging');});
    li.addEventListener('dragend',function(){li.classList.remove('dragging');});
    li.addEventListener('dragover',function(e){e.preventDefault();li.classList.add('drag-over');});
    li.addEventListener('dragleave',function(){li.classList.remove('drag-over');});
    li.addEventListener('drop',function(e){
      e.preventDefault();li.classList.remove('drag-over');
      var to=+li.dataset.i;if(dragIdx===null||dragIdx===to)return;
      var ref=isRetry?S.retryOrderItems:S.orderItems;
      if(!ref||!ref.length){
        // Initialise from items if not set
        if(isRetry)S.retryOrderItems=correctItems.slice();
        else S.orderItems=correctItems.slice();
        ref=isRetry?S.retryOrderItems:S.orderItems;
      }
      var arr=ref.slice(),item=arr.splice(dragIdx,1)[0];arr.splice(to,0,item);
      if(isRetry)S.retryOrderItems=arr;else S.orderItems=arr;
      render();
    });
  });
}

// ── Fix: renderExplContent handles matching format variations ─────────────
function renderExplContent(q,expl){
  var h='';
  if(expl.concept)h+='<div class="xcpt">&#128161; <strong>Key concept:</strong> '+esc(expl.concept)+'</div>';
  if((q.type==='single'||q.type==='multi')&&q.options){
    Object.entries(q.options).forEach(function(kv){
      var L=kv[0],e=expl[L];if(!e)return;
      var ok=e.ok||q.correct.includes(L);
      h+='<div class="xrow"><div class="xico">'+(ok?'&#9989;':'&#10060;')+'</div><div class="xtxt '+(ok?'bok':'berr')+'"><strong>'+L+'. '+esc(kv[1])+'</strong><br>'+esc(e.why||'')+'</div></div>';
    });
  }else if(q.type==='matching'){
    // Accept expl.explanations OR expl.pairs OR try to use the pairs directly
    var expls=expl.explanations||expl.pairs||[];
    if(expls.length){
      expls.forEach(function(e){
        h+='<div class="xrow"><div class="xico">&#9989;</div><div class="xtxt bok">'
          +'<strong>'+esc(e.description||e.desc||'')+'</strong>'
          +(e.correct?' &#8594; <em>'+esc(e.correct)+'</em>':'')
          +(e.why?'<br><span style="color:var(--text)">'+esc(e.why)+'</span>':'')
          +'</div></div>';
      });
    }else if(q.pairs){
      // Fallback: show pairs with correct answer even without explanation text
      q.pairs.forEach(function(p){
        h+='<div class="xrow"><div class="xico">&#9989;</div><div class="xtxt bok"><strong>'+esc(p.description)+'</strong> &#8594; <em>'+esc(p.correct)+'</em></div></div>';
      });
    }
  }else if(q.type==='ordering'){
    var steps=expl.steps||[];
    var correctItems=q.items||q.correct||[];
    if(steps.length){
      steps.forEach(function(s,i){
        h+='<div class="xrow"><div class="xico" style="color:var(--acc);font-weight:700">'+(i+1)+'</div><div class="xtxt"><strong>'+esc(s.step||correctItems[i]||'')+'</strong><br>'+esc(s.why||'')+'</div></div>';
      });
    }else if(correctItems.length){
      // Fallback: show the correct order at least
      correctItems.forEach(function(item,i){
        h+='<div class="xrow"><div class="xico" style="color:var(--acc);font-weight:700">'+(i+1)+'</div><div class="xtxt"><strong>'+esc(item)+'</strong></div></div>';
      });
    }
  }else if(q.type==='truefalse'){
    // Show the why explanation for true/false questions
    var ans=q.correct&&q.correct[0]||'?';
    if(expl.why){
      h+='<div class="xrow"><div class="xico">&#9989;</div><div class="xtxt bok"><strong>'+esc(ans)+'</strong><br>'+esc(expl.why)+'</div></div>';
    }
  }
  return h;
}

  try{var json=JSON.stringify(exportData,null,2);var blob=new Blob([json],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=(ACTIVE_EXAM?(ACTIVE_EXAM.provider+'-'+ACTIVE_EXAM.name).toLowerCase().replace(/[^a-z0-9]+/g,'-'):'exam')+'-questions.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);}catch(e){alert('Export failed: '+e.message);}

function validateQuestion(q){
  if(!q||typeof q!=='object')return'not an object';if(!q.id||typeof q.id!=='number')return'missing numeric id';if(!q.stem||typeof q.stem!=='string')return'missing stem';
  var validTypes=['single','multi','truefalse','ordering','matching'];if(!q.type||!validTypes.includes(q.type))return'type must be one of: '+validTypes.join(', ');
  if(q.type==='single'||q.type==='multi'){if(!q.options||typeof q.options!=='object')return'missing options object';if(!q.correct||!Array.isArray(q.correct)||!q.correct.length)return'missing correct array';}
  if(q.type==='ordering'){if((!q.items||!Array.isArray(q.items)||!q.items.length)&&(!q.correct||!Array.isArray(q.correct)||!q.correct.length))return'ordering needs items or correct array';}

function buildCleanQ(q){var cq={id:q.id,type:q.type,stem:q.stem};if(q.options)cq.options=q.options;if(q.correct)cq.correct=q.correct;if(q.items)cq.items=q.items;if(q.pairs)cq.pairs=q.pairs;return cq;}

function normaliseExpl(q){
  if(q.explanation&&typeof q.explanation==='object'&&!Array.isArray(q.explanation)&&Object.keys(q.explanation).length>0)return q.explanation;
  if((q.type==='ordering')&&Array.isArray(q.steps)&&q.steps.length)return{concept:q.concept||'',steps:q.steps};
  if((q.type==='matching')&&Array.isArray(q.explanations)&&q.explanations.length)return{concept:q.concept||'',explanations:q.explanations};
  if((q.type==='single'||q.type==='multi')&&q.concept){var expl={concept:q.concept},anyOpt=false;'ABCDE'.split('').forEach(function(k){if(q[k]&&typeof q[k]==='object'){expl[k]=q[k];anyOpt=true;}});if(anyOpt)return expl;}
  if(q.type==='truefalse'&&(q.concept||q.why))return{concept:q.concept||'',why:q.why||''};
  return null;
}

function processImportJSON(text, msgEl){
  try{
    var raw;
    try{raw=JSON.parse(text);}catch(je){var m=je.message.match(/position (\d+)/);var hint=m?' near char '+m[1]+' \u2014 paste into jsonlint.com to find the exact line':'';throw new Error('Invalid JSON'+hint+'. Parser: '+je.message);}
    var questions=Array.isArray(raw)?raw:(raw.questions||[]);
    if(!questions.length)throw new Error('No questions array found. Must be [] or {"questions":[...]}');
    var expLoaded=0,qAdded=0,qUpdated=0,rescued=0,skipped=0,errs=[];
    var existingIds=new Set(QS.map(function(q){return q.id;}));
    questions.forEach(function(q){
      if(!q||typeof q!=='object'){errs.push('non-object entry');return;}
      var qid=parseInt(q.id);if(!qid){errs.push('entry missing numeric id');return;}
      var expl=normaliseExpl(q);
      if(expl){var wasRescued=!(q.explanation&&typeof q.explanation==='object'&&Object.keys(q.explanation).length>0);S.explanations[qid]=expl;S.cache[qid]=expl;expLoaded++;if(wasRescued)rescued++;}
      if(q.stem&&q.type){var err=validateQuestion(q);if(err){errs.push('Q'+qid+': '+err);return;}var cleanQ=buildCleanQ(q);if(existingIds.has(qid)){var idx=QS.findIndex(function(qq){return qq.id===qid;});if(idx>=0){QS[idx]=cleanQ;qUpdated++;}}else{QS.push(cleanQ);existingIds.add(qid);qAdded++;}}else if(!expl){skipped++;}
    });
    QS.sort(function(a,b){return a.id-b.id;});
    var parts=[];
    if(expLoaded)parts.push(expLoaded+' explanation'+(expLoaded>1?'s':'')+' loaded'+(rescued?' ('+rescued+' auto-corrected)':''));
    if(qAdded)parts.push(qAdded+' question'+(qAdded>1?'s':'')+' added');
    if(qUpdated)parts.push(qUpdated+' question'+(qUpdated>1?'s':'')+' updated');
    if(skipped)parts.push(skipped+' item'+(skipped>1?'s':'')+' skipped');
    if(!parts.length)throw new Error('Nothing imported. Each entry needs {id, explanation} or {id, stem, type, ...}.');
    if(errs.length)parts.push('\u26a0 '+errs.length+' error'+(errs.length>1?'s':'')+': '+errs.slice(0,4).join(' | ')+(errs.length>4?'\u2026':''));
    if(msgEl){msgEl.style.color='var(--ok-txt)';msgEl.textContent='Saving\u2026';}
    saveContent().then(function(ok){if(msgEl){msgEl.style.color=ok?'var(--ok-txt)':'var(--warn-txt)';msgEl.textContent=(ok?'\u2713 ':'\u26a0 Local only \u2014 ')+parts.join(', ')+'.';}render();});
  }catch(e){if(msgEl){msgEl.style.color='var(--err-txt)';msgEl.textContent='\u2717 '+e.message;}}
}
function handleImportFile(input){
  var file=input.files[0];if(!file)return;
  var msgEl=document.getElementById('importMsg');
  var reader=new FileReader();
  reader.onload=function(ev){processImportJSON(ev.target.result,msgEl);input.value='';};
  reader.onerror=function(){if(msgEl){msgEl.style.color='var(--err-txt)';msgEl.textContent='\u2717 Could not read file';}};
  reader.readAsText(file);
}

function saveEditFull(qid,editQ,editExp,msgEl,overlay){
  if(!(editQ.stem||'').trim()){msgEl.style.color='var(--err-txt)';msgEl.textContent='Stem cannot be empty';return;}
  if((editQ.type==='single'||editQ.type==='multi')&&(!editQ.correct||!editQ.correct.length)){msgEl.style.color='var(--err-txt)';msgEl.textContent='Enter at least one correct answer';return;}
  if(editQ.type==='truefalse'&&(!editQ.correct||!editQ.correct.length)){msgEl.style.color='var(--err-txt)';msgEl.textContent='Select True or False';return;}
  if(editQ.type==='ordering'&&(!editQ.correct||editQ.correct.length<2)){msgEl.style.color='var(--err-txt)';msgEl.textContent='Enter at least 2 items';return;}
  if(editQ.type==='matching'&&(!editQ.pairs||editQ.pairs.length<2)){msgEl.style.color='var(--err-txt)';msgEl.textContent='Add at least 2 pairs';return;}
  var q=QS.find(function(x){return x.id===qid;});if(!q)return;
  // Wipe old type-specific fields before applying
  delete q.options;delete q.pairs;delete q.items;
  Object.assign(q,JSON.parse(JSON.stringify(editQ)));
  S.corrections=S.corrections||{};S.corrections[qid]=JSON.parse(JSON.stringify(editQ));
  // Save explanation
  if(editExp&&Object.keys(editExp).length){
    if(editQ.type==='single'||editQ.type==='multi'){
      Object.keys(editExp).forEach(function(k){if(editExp[k]&&typeof editExp[k]==='object'&&editExp[k].ok!==undefined){editExp[k].ok=(editQ.correct||[]).indexOf(k)>=0;}});
    }
    S.explanations[qid]=editExp;
    S.cache[qid]=editExp;
  }
  msgEl.style.color='var(--muted)';msgEl.textContent='Saving\u2026';
  saveContent().then(function(ok){
    if(msgEl)msgEl.textContent=ok?'\u2713 Saved!':'\u26a0 Local only — sync when online';
    if(msgEl)msgEl.style.color=ok?'var(--ok-txt)':'var(--warn-txt)';
    render();
  });
}

  var countBar=document.createElement('div');countBar.style.cssText='font-size:12px;color:var(--muted);margin-bottom:6px';
  function updateCount(){
    var n=Object.keys(selIds).filter(function(k){return selIds[k];}).length;

  }

  var listWrap=document.createElement('div');
  listWrap.style.cssText='overflow-y:auto;flex:1;min-height:180px;border:1px solid var(--bdr);border-radius:var(--rs)';

  function toggle(qid){
    selIds[qid]=!selIds[qid];
    // Update only the affected element(s)
    listWrap.querySelectorAll('[data-qid="'+qid+'"]').forEach(function(el){
      applyVisual(el,!!selIds[qid]);
    });
    updateCount();
  }

  function applyVisual(el,sel){
    if(el.classList.contains('gsq')){
      el.style.borderColor=sel?'var(--acc)':'var(--bdr2)';
      el.style.background=sel?'var(--acc-bg)':'var(--surf2)';
      el.style.color=sel?'var(--acc)':'var(--text)';
      el.style.fontWeight=sel?'800':'600';
    } else {
      var cb=el.querySelector('input[type=checkbox]');if(cb)cb.checked=sel;
      el.style.background=sel?'var(--acc-bg)':'';
    }
  }

  function updateVisuals(){
    listWrap.querySelectorAll('[data-qid]').forEach(function(el){
      applyVisual(el,!!selIds[parseInt(el.dataset.qid)]);
    });
  }

  function renderList(){
    listWrap.innerHTML='';
    var fl=filterStr.toLowerCase();
    var vis=QS.filter(function(q){return!fl||q.stem.toLowerCase().includes(fl)||String(q.id).includes(fl);});
    if(!vis.length){var em=document.createElement('div');em.style.cssText='padding:14px;font-size:13px;color:var(--muted)';em.textContent='No questions match.';listWrap.appendChild(em);return;}

    if(viewMode==='grid'){
      var grid=document.createElement('div');grid.style.cssText='display:flex;flex-wrap:wrap;gap:5px;padding:10px';
      vis.forEach(function(q){
        var sq=document.createElement('div');sq.className='gsq';sq.dataset.qid=q.id;
        var sel=!!selIds[q.id];
        sq.style.cssText='width:40px;height:40px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:'+(sel?'800':'600')+';cursor:pointer;user-select:none;border:2px solid '+(sel?'var(--acc)':'var(--bdr2)')+';background:'+(sel?'var(--acc-bg)':'var(--surf2)')+';color:'+(sel?'var(--acc)':'var(--text)');
        sq.title='#'+q.id+': '+q.stem.slice(0,80);
        sq.textContent=q.id;
        sq.onclick=function(){toggle(q.id);};
        grid.appendChild(sq);
      });
      listWrap.appendChild(grid);
    } else {
      vis.forEach(function(q){
        var row=document.createElement('div');row.className='set-q-item';row.dataset.qid=q.id;
        var sel=!!selIds[q.id];if(sel)row.style.background='var(--acc-bg)';
        var cb=document.createElement('input');cb.type='checkbox';cb.checked=sel;
        cb.onchange=function(e){e.stopPropagation();selIds[q.id]=this.checked;applyVisual(row,this.checked);updateCount();};
        var lbl=document.createElement('label');lbl.style.cssText='font-size:12px;line-height:1.45;cursor:pointer;flex:1;pointer-events:none';
        lbl.innerHTML=badge(q.type)+' <span style="color:var(--muted);font-size:11px">#'+q.id+'</span> '+esc(q.stem.slice(0,90))+(q.stem.length>90?'\u2026':'');
        row.onclick=function(e){if(e.target===cb)return;selIds[q.id]=!selIds[q.id];cb.checked=selIds[q.id];applyVisual(row,selIds[q.id]);updateCount();};
        row.appendChild(cb);row.appendChild(lbl);listWrap.appendChild(row);
      });
    }
  }
  modal.appendChild(listWrap);

  // ── Footer ─────────────────────────────────────────────────────────────
  // Shuffle toggle
  var shuffleRow=document.createElement('div');shuffleRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:4px;margin-top:6px';
  var shuffleChk=document.createElement('input');shuffleChk.type='checkbox';shuffleChk.id='setShuffleChk';shuffleChk.checked=true;shuffleChk.style.cssText='width:15px;height:15px;accent-color:var(--acc);cursor:pointer';
  var shuffleLbl=document.createElement('label');shuffleLbl.htmlFor='setShuffleChk';shuffleLbl.style.cssText='font-size:13px;cursor:pointer;color:var(--text)';shuffleLbl.textContent='Shuffle question order';
  shuffleRow.appendChild(shuffleChk);shuffleRow.appendChild(shuffleLbl);modal.appendChild(shuffleRow);

  var msgEl=document.createElement('div');msgEl.style.cssText='font-size:12px;min-height:14px;margin-top:8px';modal.appendChild(msgEl);
  var foot=document.createElement('div');foot.style.cssText='display:flex;gap:8px;margin-top:8px';
  var saveBtn=document.createElement('button');saveBtn.className='btn-acc';saveBtn.style.flex='1';saveBtn.textContent='\u2713 Create Set';
  saveBtn.onclick=async function(){
    var name=(nameInp.value||'').trim();
    var qids=Object.keys(selIds).filter(function(k){return selIds[k];}).map(Number);
    if(!name){msgEl.style.color='var(--err-txt)';msgEl.textContent='Enter a set name.';return;}
    if(!qids.length){msgEl.style.color='var(--err-txt)';msgEl.textContent='Select at least one question.';return;}
    var newSet={id:'set_'+Date.now().toString(36),name:name,qids:qids,shuffle:shuffleChk.checked};
    if(!ACTIVE_EXAM.sets)ACTIVE_EXAM.sets=[];
    ACTIVE_EXAM.sets.push(newSet);
    var idx=examDefs.findIndex(function(e){return e.id===ACTIVE_EXAM.id;});
    if(idx>=0)examDefs[idx].sets=ACTIVE_EXAM.sets;
    msgEl.style.color='var(--muted)';msgEl.textContent='Saving\u2026';
    try{
      await SB.from('quiz_content').upsert([{key:'exam_defs',data:examDefs,updated_at:new Date().toISOString()}]);
      msgEl.style.color='var(--ok-txt)';msgEl.textContent='\u2713 Set created!';
      setTimeout(function(){ov.remove();render();},600);
    }catch(e){msgEl.style.color='var(--err-txt)';msgEl.textContent='Save failed: '+e.message;ACTIVE_EXAM.sets.pop();if(idx>=0)examDefs[idx].sets=ACTIVE_EXAM.sets;}
  };
  var cancelBtn=document.createElement('button');cancelBtn.className='btn';cancelBtn.textContent='Cancel';cancelBtn.onclick=function(){ov.remove();};
  foot.appendChild(saveBtn);foot.appendChild(cancelBtn);modal.appendChild(foot);
  renderList();
}

async function switchExam(examId){
  if(ACTIVE_EXAM&&ACTIVE_EXAM.id===examId)return;
  if(S.exam&&!S.exam.submitted){if(!confirm('An exam is in progress and will be lost. Switch anyway?'))return;clearInterval(examInterval);S.exam=null;}
  setSS(false,'switching\u2026');
  if(!progressData.perExam)progressData.perExam={};
  if(ACTIVE_EXAM)progressData.perExam[ACTIVE_EXAM.id]={tries:S.tries,activeTry:S.activeTry,examAttempts:S.exams};
  // Switch ACTIVE_EXAM BEFORE dbsave so lastExamId is saved correctly
  ACTIVE_EXAM=examDefs.find(function(e){return e.id===examId;})||examDefs[0];
  progressData.lastExamId=ACTIVE_EXAM.id;
  var ep=progressData.perExam&&progressData.perExam[ACTIVE_EXAM.id];
  S.tries=ep?ep.tries||[]:[];S.activeTry=ep?ep.activeTry||1:1;S.exams=ep?ep.examAttempts||[]:[];
  S.idx=0;S.activeCat='all';S.view='quiz';S.exam=null;rst();
  await loadExamContent(ACTIVE_EXAM.id);
  var td=getTD();S.idx=0;for(var i=0;i<QS.length;i++){if(!td.answers[QS[i].id]){S.idx=i;break;}}
  updTryBtn();updateLogoEl();
  await dbsave();
  setSS(true,'synced \u2713');render();
}
